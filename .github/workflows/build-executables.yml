name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
            data_sep: ":"
          - os: windows-latest
            platform: windows
            ext: ".exe"
            data_sep: ";"
          - os: macos-latest
            platform: macos
            ext: ""
            data_sep: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name sunchha \
            --add-data "config.yaml${{ matrix.data_sep }}." \
            --add-data "target${{ matrix.data_sep }}target" \
            --add-data "utils/offline_commands.json${{ matrix.data_sep }}utils" \
            main.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist_artifacts/package
          cp "dist/sunchha${{ matrix.ext }}" dist_artifacts/package/
          cp config.yaml dist_artifacts/package/
          cp -r target dist_artifacts/package/
          cp -r docs dist_artifacts/package/

          python - <<'PY'
          import os
          import zipfile

          platform = "${{ matrix.platform }}"
          out_dir = "dist_artifacts"
          pkg_dir = os.path.join(out_dir, "package")
          zip_path = os.path.join(out_dir, f"sunchha-{platform}.zip")

          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(pkg_dir):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, pkg_dir)
                      zf.write(full, rel)
          print(f"created: {zip_path}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunchha-${{ matrix.platform }}
          path: dist_artifacts/sunchha-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release_files
          find release_artifacts -type f -name "*.zip" -exec cp {} release_files/ \;
          ls -la release_files

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_files/sunchha-windows.zip
            release_files/sunchha-linux.zip
            release_files/sunchha-macos.zip
