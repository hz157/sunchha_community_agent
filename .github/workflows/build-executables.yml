name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
            data_sep: ":"
          - os: windows-latest
            platform: windows
            ext: ".exe"
            data_sep: ";"
          - os: macos-latest
            platform: macos
            ext: ""
            data_sep: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare config
        shell: bash
        run: |
          cp config.example.yaml config.yaml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name sunchha \
            --add-data "config.yaml${{ matrix.data_sep }}." \
            --add-data "target${{ matrix.data_sep }}target" \
            --add-data "utils/offline_commands.json${{ matrix.data_sep }}utils" \
            main.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist_artifacts/package
          cp "dist/sunchha${{ matrix.ext }}" dist_artifacts/package/
          cp config.yaml dist_artifacts/package/
          cp -r target dist_artifacts/package/
          cp -r docs dist_artifacts/package/

          python - <<'PY'
          import os
          import zipfile

          platform = "${{ matrix.platform }}"
          out_dir = "dist_artifacts"
          pkg_dir = os.path.join(out_dir, "package")
          zip_path = os.path.join(out_dir, f"sunchha-{platform}.zip")

          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(pkg_dir):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, pkg_dir)
                      zf.write(full, rel)

          print(f"created: {zip_path}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunchha-${{ matrix.platform }}
          path: dist_artifacts/sunchha-${{ matrix.platform }}.zip
          if-no-files-found: error